name: Generate Snake Contribution Grid

on:
  schedule:
    # S'exécute automatiquement toutes les 12 heures
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Génère le serpent/dragon à partir des contributions
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF8C00&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Publie les fichiers SVG générés dans la branche "output"
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}